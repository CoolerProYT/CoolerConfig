plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

// CoolerConfig is consumed as a library, so its javadoc is a shipped artifact rather than a
// developer convenience. Keep the accessibility/HTML checks that make it readable, but do not
// fail the build over undocumented @param tags on loader glue classes nobody calls.
tasks.named('javadoc', Javadoc).configure {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_version_range'       : neoforge_version_range,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version,
            'night_config_version'         : night_config_version,
            'fabric_mc_version_range'      : fabric_mc_version_range,
            'homepage_url'                 : homepage_url,
            'sources_url'                  : sources_url,
            'issues_url'                   : issues_url
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java

            pom {
                name = "${mod_name} (${project.name})"
                description = project.description
                url = homepage_url
                licenses {
                    license {
                        name = license
                        url = 'https://creativecommons.org/publicdomain/zero/1.0/'
                    }
                }
                developers {
                    developer {
                        id = mod_author
                        name = mod_author
                    }
                }
                scm {
                    url = sources_url
                    connection = "scm:git:${sources_url}.git"
                    developerConnection = "scm:git:${sources_url}.git"
                }
            }
        }
    }
    repositories {
        // Only declare the remote repo when it has actually been configured (normally in
        // ~/.gradle/gradle.properties). Otherwise `url = null` breaks configuration for everyone
        // who just wants to build the mod or publish to mavenLocal.
        if (project.findProperty('maven_url')) {
            maven {
                name = 'CoolerProMC'
                url = project.findProperty('maven_url')
                credentials {
                    username = project.findProperty('maven_username')
                    password = project.findProperty('maven_password')
                }
            }
        }
    }
}
