# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=26.1.2.29
group=com.coolerpromc.coolerconfig
java_version=25

# Common
minecraft_version=26.1.2
mod_name=CoolerConfig
mod_author=CoolerProMC
mod_id=coolerconfig
license=MIT
credits=
description=A multiloader config library for Minecraft mods, supporting TOML, HOCON, JSON and JSON5 with validation, comments, hot-reload and Codec-backed structured data.
minecraft_version_range=[26.1,)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Links, surfaced in the mod list and in the published POM
homepage_url=https://github.com/CoolerProYT/CoolerConfig
sources_url=https://github.com/CoolerProYT/CoolerConfig
issues_url=https://github.com/CoolerProYT/CoolerConfig/issues

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.145.4+26.1.2
fabric_loader_version=0.18.6

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.7-beta
neoforge_loader_version_range=[4,)
## Accept any NeoForge for this Minecraft version, rather than pinning to the exact build we compile against
neoforge_version_range=[26.1,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Dependencies
night_config_version=3.8.3
typesafe_config_version=1.4.2
